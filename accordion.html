:root {
    --bg0: #05070c;
    --bg1: #0a1020;
    --card: rgba(255, 255, 255, 0.06);
    --card2: rgba(255, 255, 255, 0.1);
    --text: #eaf0ff;
    --muted: rgba(234, 240, 255, 0.72);
    --line: rgba(255, 255, 255, 0.12);
    --shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --dur: 720ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    background: radial-gradient(1000px 600px at 15% 10%, rgba(124, 255, 178, 0.1), transparent 55%),

        radial-gradient(900px 600px at 55% 90%, rgba(255, 125, 125, 0.08), transparent 62%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.wrap { width: min(1200px, 96vw); height: min(720px, 92vh); display: flex; flex-direction: column; gap: 14px; }
.topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 16px;

    border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35); backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 240px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #7cffb2; box-shadow: 0 0 18px rgba(124, 255, 178, 0.55); }
.brand-title { font-weight: 800; letter-spacing: 0.2px; }
.brand-sub { font-size: 12px; color: var(--muted); }
.top-actions { display: flex; gap: 10px; }
.chip {
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--text);
    padding: 10px 12px; border-radius: 999px; cursor: pointer;
    transition: transform 180ms var(--ease), background 180ms var(--ease);
}
.chip:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.1); }
.chip:active { transform: translateY(0px) scale(0.98); }
.stage {
    position: relative; flex: 1; border-radius: 18px; overflow: hidden;
    box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.18);
}
.status {

    background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(10px);
}
.status-led { width: 8px; height: 8px; border-radius: 50%; background: #7cffb2; box-shadow: 0 0 18px rgba(124, 255, 178, 0.55); }
.status-text { font-size: 12px; color: var(--muted); }
.status-text b { color: var(--text); }
.status-hint { font-size: 12px; color: rgba(234, 240, 255, 0.55); }
.accordion { height: 100%; display: flex; }
.panel {
    position: relative; flex: 1; cursor: pointer;
    transition: flex var(--dur) var(--ease), filter var(--dur) var(--ease);
    overflow: hidden; filter: saturate(0.75) grayscale(0.2) brightness(0.9); isolation: isolate;
}
.panel.active { flex: 2.7; filter: saturate(1.05) grayscale(0) brightness(1); }
.panel-bg {
    position: absolute; inset: 0; background-image: var(--bg); background-size: cover; background-position: center;
    transform: scale(1.05); transition: transform 900ms var(--ease);
}
.panel.active .panel-bg { transform: scale(1.12); }
.panel::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(800px 380px at 40% 30%, rgba(255, 255, 255, 0.12), transparent 55%),

}
.panel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.55)); opacity: 0.25; z-index: 1;
}
.panel-content { position: absolute; left: 24px; right: 24px; bottom: 22px; z-index: 2; color: var(--text); }
.panel-kicker {

}
.panel.active .panel-kicker { opacity: 1; transform: translateY(0); transition-delay: 140ms; }
.pill { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(0, 0, 0, 0.2); }
.pill.ghost { color: rgba(234, 240, 255, 0.7); background: rgba(255, 255, 255, 0.06); }
.panel-id {
    position: absolute; left: 0; bottom: -8px; font-size: 64px; font-weight: 300;
    color: rgba(255, 255, 255, 0.25); letter-spacing: -2px; transition: all var(--dur) var(--ease);
}
.panel.active .panel-id { bottom: auto; top: -56px; font-size: 52px; color: rgba(255, 255, 255, 0.35); }
.panel-title {
    font-size: 30px; letter-spacing: 0.2px; font-weight: 800; margin-bottom: 6px;
    opacity: 0; transform: translateY(18px); transition: opacity 520ms var(--ease), transform 520ms var(--ease);
}
.panel.active .panel-title { opacity: 1; transform: translateY(0); transition-delay: 220ms; }
.panel-subtitle {

.panel.active .panel-subtitle { opacity: 1; transform: translateY(0); transition-delay: 300ms; }
.grid {

.panel.active .grid { opacity: 1; transform: translateY(0); transition-delay: 380ms; }

.k { color: rgba(234, 240, 255, 0.7); font-size: 13px; }

.panel.active .cta-row { opacity: 1; transform: translateY(0); transition-delay: 520ms; }
.cta {

}
.corner::before, .corner::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.75); transition: transform 200ms var(--ease), opacity 200ms var(--ease);
}
.corner::before { width: 14px; height: 2px; }
.corner::after { width: 2px; height: 14px; }
.panel.active .corner::after { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
.corner:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.08); }
.corner:active { transform: translateY(0px) scale(0.98); }

.nav:active { transform: translateY(-50%) scale(0.98); }
.nav-prev { left: 12px; }
.nav-next { right: 12px; }

.mini-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.4); }

    .nav { top: auto; bottom: 12px; transform: none; }
    .nav-prev { left: 12px; }
    .nav-next { right: 12px; }

/* ═══════════════════════════════════════════════════════════════
   MOTOR — construye el panel EXACTAMENTE como el original
   y aplica la lógica original (NeonAccordion). No tocar.
═══════════════════════════════════════════════════════════════ */
(function(){
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  /* ── MÓDULO DE COMPRA: detección de moneda (estilo Hotmart, sin backend).
       Si el navegador está en Perú (zona horaria America/Lima o idioma es-PE)
       muestra SOLES primero; para el resto del mundo, USD primero. ── */
  const isPeru = (() => {
    try {
      const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
      const langs = [navigator.language].concat(navigator.languages || []).join(' ').toUpperCase();
      return tz === 'America/Lima' || /[-_]PE\b/.test(langs);
    } catch (e) { return false; }
  })();
  const moneyPEN = v => 'S/ ' + v;
  const moneyUSD = v => '$ ' + v + ' USD';

  /* ── MULTIMONEDA (estilo Hotmart): convierte el precio USD a la moneda
       local del visitante con el tipo de cambio del día (API gratuita,
       sin clave). Perú ve soles exactos; EE. UU. ve USD; el resto ve
       "≈ su moneda" y paga en USD. Si la API falla, todo queda en USD. ── */
  const FX = { cur: null, rate: null };
  const REGION_CUR = {
    PE:'PEN', MX:'MXN', CO:'COP', AR:'ARS', CL:'CLP', BO:'BOB', PY:'PYG', UY:'UYU',
    BR:'BRL', VE:'VES', EC:'USD', PA:'USD', SV:'USD', GT:'GTQ', HN:'HNL', NI:'NIO',
    CR:'CRC', DO:'DOP', US:'USD', CA:'CAD', GB:'GBP', AU:'AUD', NZ:'NZD', JP:'JPY',
    KR:'KRW', CN:'CNY', IN:'INR', CH:'CHF', SE:'SEK', NO:'NOK', DK:'DKK', PL:'PLN',
    CZ:'CZK', RO:'RON', TR:'TRY', ZA:'ZAR',
    ES:'EUR', FR:'EUR', DE:'EUR', IT:'EUR', PT:'EUR', NL:'EUR', BE:'EUR', AT:'EUR',
    IE:'EUR', FI:'EUR', GR:'EUR'
  };
  const TZ_REGION = {
    'America/Lima':'PE','America/Bogota':'CO','America/Mexico_City':'MX','America/Santiago':'CL',
    'America/La_Paz':'BO','America/Asuncion':'PY','America/Montevideo':'UY','America/Sao_Paulo':'BR',
    'America/Caracas':'VE','America/Guayaquil':'EC','America/Panama':'PA','America/Guatemala':'GT',
    'America/Tegucigalpa':'HN','America/Managua':'NI','America/Costa_Rica':'CR',
    'America/Santo_Domingo':'DO','Europe/Madrid':'ES'
  };
  function userRegion() {
    try { const r = new Intl.Locale(navigator.language).region; if (r) return r.toUpperCase(); } catch (e) {}
    const m = String(navigator.language || '').match(/[-_]([A-Za-z]{2})$/);
    if (m) return m[1].toUpperCase();
    try { return TZ_REGION[Intl.DateTimeFormat().resolvedOptions().timeZone] || null; } catch (e) { return null; }
  }
  function niceRound(v) {
    if (v >= 100000) return Math.round(v / 1000) * 1000;
    if (v >= 1000) return Math.round(v / 10) * 10;
    if (v >= 100) return Math.round(v);
    return Math.round(v * 10) / 10;
  }
  function fmtLocal(usd) {
    const v = niceRound(usd * FX.rate);
    let out;
    try {
      out = new Intl.NumberFormat(navigator.language || 'es',
        { style: 'currency', currency: FX.cur, maximumFractionDigits: v >= 100 ? 0 : 2 }).format(v);
    } catch (e) { out = v + ' ' + FX.cur; }
    /* Si el símbolo local es solo "$" (MXN, COP, CLP...), añade el código
       para que no se confunda con dólares: "≈ $1,110 MXN". */
    if (FX.cur !== 'USD' && out.indexOf('$') !== -1 && out.indexOf(FX.cur) === -1) out += ' ' + FX.cur;
    return out;
  }
  function applyFx() {
    if (!FX.rate || !FX.cur) return;
    document.querySelectorAll('.buy-price[data-usd]').forEach(el => {
      el.textContent = '\u2248 ' + fmtLocal(Number(el.getAttribute('data-usd')) || 0);
    });
    document.querySelectorAll('[data-fxline]').forEach(el => {
      el.textContent = 'Pago: ' + moneyUSD(el.getAttribute('data-usd2')) + ' · comisión incluida';
    });
  }
  (function loadFx() {
    if (isPeru || typeof fetch !== 'function') return;     /* Perú usa soles manuales */
    const region = userRegion();
    const cur = region ? REGION_CUR[region] : null;
    if (!cur || cur === 'USD' || cur === 'PEN') return;    /* USD o sin datos: no convertir */
    fetch('https://open.er-api.com/v6/latest/USD')
      .then(r => r.json())
      .then(d => {
        const rate = d && d.rates && d.rates[cur];
        if (!rate) return;
        FX.cur = cur; FX.rate = rate;
        applyFx();
      })
      .catch(() => {});                                    /* Falla → se queda en USD */
  })();

  /* Tarjeta derecha (meta): si el panel tiene "buy" se vuelve PRECIO;
     si no, se construye EXACTAMENTE como el original. */
  const buildMeta = p => {
    if (p.buy) {
      const b = p.buy;
      const proof = b.buyers
        ? `<div class="fine buy-proof"><span class="buy-live" aria-hidden="true"></span><b data-countup="${Number(b.buyers)||0}">0</b>&nbsp;personas ya lo adquirieron</div>`
        : '';
      /* Programa GRATUITO: muestra "GRATIS" sin montos ni conversión. */
      if (b.gratis) {
        return `<div class="meta-top">
                  <span class="label">Precio</span>
                  <span class="value buy-price">GRATIS</span>
                </div>
                <div class="fine">Descarga sin costo</div>
                ${proof}`;
      }
      const prim = isPeru ? moneyPEN(b.pen) : moneyUSD(b.usd);
      const sec  = isPeru ? moneyUSD(b.usd) + ' · comisión incluida' : moneyPEN(b.pen);
      return `<div class="meta-top">
                  <span class="label">Precio</span>
                  <span class="value buy-price" data-usd="${Number(b.usd)||0}">${esc(prim)}</span>
                </div>
                <div class="fine" data-fxline data-usd2="${Number(b.usd)||0}">También: ${esc(sec)}</div>
                ${proof}`;
    }
    return `<div class="meta-top">
                  <span class="label">${esc(p.metaLabel)}</span>
                  <span class="value">${esc(p.metaValue)}</span>
                </div>
                <div class="bar"><span class="bar-fill" style="width: ${Number(p.bar)||0}%"></span></div>
                <div class="fine">${esc(p.fine)}</div>`;
  };

  /* Contador animado (0 → cifra) con frenado suave. */
  const counted = new WeakSet();
  function countUp(el) {
    if (counted.has(el)) return;
    counted.add(el);
    const target = Number(el.getAttribute('data-countup')) || 0;
    const t0 = performance.now(), dur = 950;
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur);
      const e2 = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(target * e2);
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  /* Búsqueda tolerante de la llave: ignora mayúsculas, espacios,
     puntos y guiones (ej. "Cypecad 2026", "CYPECAD-2026" o
     "cypecad-2026.c" encuentran la entrada "cypecad-2026"). */
  const params = new URLSearchParams(location.search);
  const rawKey = params.get('sw');
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
  let conf = null;
  if (rawKey) {
    const nk = norm(rawKey);
    for (const k in SW_DETAIL) {
      const nm = norm(k);
      if (nm === nk || (nm.length >= 4 && (nk.startsWith(nm) || nm.startsWith(nk)))) { conf = SW_DETAIL[k]; break; }
    }
  }
  const panelsData = (conf && conf.panels) ? conf.panels : DEFAULT_PANELS;
  if (conf && conf.brandTitle) document.getElementById('brandTitle').textContent = conf.brandTitle;
  /* Si llegó una llave pero NO está personalizada, la muestra en la

    const badges = (p.badges||[]).map(b => `<span class="badge">${esc(b)}</span>`).join('');
    const cta = (p.buy && p.buy.gratis)

          <div class="bm-actions">
            <button class="ghost-btn" type="button" data-bm="close">Cancelar</button>
            <button class="cta" type="button" data-bm="confirm">Confirmar</button>
          </div>
        </div>
        <div class="bm-step" data-step="2" hidden>
          <span class="pill" style="border-color:${esc(accent)}">Último paso</span>
          <h3 class="bm-title">¡Listo! Coordina tu compra</h3>
          <p class="bm-sub">Escríbenos y te respondemos con el método de pago y la entrega.</p>
          <div class="bm-actions col">
            <a class="cta" data-bm="mail" href="#">\u2709&nbsp;Contactar por correo</a>
            ${tg ? `<a class="ghost-btn" target="_blank" rel="noopener noreferrer" href="${esc(tg)}">Telegram</a>` : ''}
            <button class="ghost-btn" type="button" data-bm="back">Volver</button>
          </div>
        </div>
      </div>`;

    const step1 = back.querySelector('[data-step="1"]');
    const step2 = back.querySelector('[data-step="2"]');
    back.querySelectorAll('.bm-price').forEach(el => {
      el.addEventListener('click', () => {
        chosen = el.getAttribute('data-cur');
        back.querySelectorAll('.bm-price').forEach(x => x.classList.toggle('sel', x === el));
      });
    });
    back.querySelector('[data-bm="close"]').addEventListener('click', () => back.classList.remove('open'));
    back.querySelector('[data-bm="back"]').addEventListener('click', () => { step2.hidden = true; step1.hidden = false; });
    back.querySelector('[data-bm="confirm"]').addEventListener('click', () => {
      const precio = chosen === 'PEN' ? moneyPEN(b.pen) + ' (soles)' : moneyUSD(b.usd) + ' (comisión incluida)';
      const asunto = 'Compra: ' + product;
      const cuerpo = 'Hola Engineering Eyes,\n\nQuiero comprar: ' + product +
                     '\nPrecio elegido: ' + precio +
                     '\n\nMi nombre:\nMétodo de pago preferido:\n';
      back.querySelector('[data-bm="mail"]').setAttribute('href',
        'mailto:' + email + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo));
      step1.hidden = true; step2.hidden = false;
    });

    back.classList.add('open');
    if (FX.rate && FX.cur) {
      const eq = back.querySelector('[data-fxeq]');
      if (eq) { eq.textContent = '\u2248 ' + fmtLocal(Number(b.usd) || 0); eq.style.display = 'block'; }
    }
    const proof = back.querySelector('.bm-proof [data-countup]');
    if (proof) countUp(proof);
  }

  /* Abrir el modal al pulsar un botón Comprar (delegado). */
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-buy]');
    if (!a) return;
    e.preventDefault();
    const p = panelsData[Number(a.getAttribute('data-buy'))];
    if (p && p.buy) openBuy(p);
  });

  /* Animar el contador del panel cuando su tarjeta esté activa. */
  const runCounts = () => document.querySelectorAll('.panel.active [data-countup]').forEach(countUp);
  new MutationObserver(runCounts).observe(accEl, { subtree: true, attributes: true, attributeFilter: ['class'] });
  runCounts();

  /* ── Lógica ORIGINAL del NeonAccordion (idéntica) ── */
  class NeonAccordion {
    constructor(root) {
      this.root = root;
      this.panels = [...root.querySelectorAll(".panel")];
      this.prev = document.querySelector(".nav-prev");
      this.next = document.querySelector(".nav-next");
      this.statusName = document.getElementById("statusName");
      this.modeText = document.getElementById("modeText");
      this.ambientOn = false;
      this.index = Math.max(0, this.panels.findIndex(p => p.classList.contains("active")));
      this.bind();
      this.apply(this.index, false);
    }
    bind() {
      this.panels.forEach(p => {
        p.addEventListener("click", () => { const li = this.panels.indexOf(p); if (li !== -1) this.apply(li, true); });
        p.addEventListener("mousemove", e => {
          if (!p.classList.contains("active")) return;
          const bg = p.querySelector(".panel-bg"); if (!bg) return;
          const r = p.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          bg.style.transform = `scale(1.14) translate(${x * 10}px, ${y * 8}px)`;
        });
        p.addEventListener("mouseleave", () => { const bg = p.querySelector(".panel-bg"); if (bg) bg.style.transform = ""; });
      });
      this.prev.addEventListener("click", e => { e.stopPropagation(); this.go(-1); });
      this.next.addEventListener("click", e => { e.stopPropagation(); this.go(1); });
      document.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") this.go(-1);
        if (e.key === "ArrowRight") this.go(1);
        if (e.key.toLowerCase() === "a") this.toggleAmbient();
        if (e.key.toLowerCase() === "s") this.shuffle();
      });
      document.querySelectorAll("[data-action]").forEach(btn => {
        btn.addEventListener("click", () => {
          const action = btn.getAttribute("data-action");
          if (action === "toggle-ambient") this.toggleAmbient();
          if (action === "shuffle") this.shuffle();
        });
      });
      this.root.addEventListener("click", e => {
        const btn = e.target.closest(".cta, .ghost-btn, .corner");
        if (!btn) return;
        if (btn.tagName === 'A') return;
        e.stopPropagation();
        this.toast(`${this.panels[this.index]?.dataset.title || "Item"}: action queued`);
      });
    }
    refreshPanels() { this.panels = [...this.root.querySelectorAll(".panel")]; }
    resetActive() {
      this.panels.forEach(p => { p.classList.remove("active"); const bg = p.querySelector(".panel-bg"); if (bg) bg.style.transform = ""; });
      this.index = 0;
      if (this.panels[0]) this.panels[0].classList.add("active");
    }
    apply(i, focusLed = true) {
      if (!this.panels.length) return;
      this.panels.forEach(p => p.classList.remove("active"));
      const panel = this.panels[i] || this.panels[0];
      panel.classList.add("active");
      this.index = this.panels.indexOf(panel);
      const title = panel.dataset.title || `Item ${String(this.index + 1).padStart(2, "0")}`;
      const accent = panel.dataset.accent || "#7CFFB2";
      this.statusName.textContent = title;
      const led = document.querySelector(".status-led");
      if (led) {
        led.style.background = accent;
        led.style.boxShadow = `0 0 18px ${this.hexToRgba(accent, 0.55)}`;
        if (focusLed) led.animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}], {duration:420,easing:"ease-out"});
      }
      const dot = document.querySelector(".dot");
      if (dot) { dot.style.background = accent; dot.style.boxShadow = `0 0 18px ${this.hexToRgba(accent, 0.55)}`; }
      this.panels.forEach((p, idx) => p.setAttribute("aria-selected", idx === this.index ? "true" : "false"));
    }
    go(delta) {
      if (!this.panels.length) return;
      const next = (this.index + delta + this.panels.length) % this.panels.length;
      this.apply(next, true);
    }
    toggleAmbient() {
      this.ambientOn = !this.ambientOn;
      document.body.classList.toggle("ambient", this.ambientOn);
      this.modeText.textContent = this.ambientOn ? "Mode: Ambient" : "Mode: Crisp";
      const btn = document.querySelector('[data-action="toggle-ambient"]');
      if (btn) btn.textContent = this.ambientOn ? "Crisp" : "Ambient";
      this.toast(this.ambientOn ? "Ambient mode enabled" : "Crisp mode enabled");
    }
    shuffle() {
      const a = [...this.panels];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      a.forEach(p => this.root.appendChild(p));
      this.refreshPanels();
      this.resetActive();
      this.apply(0, true);
      this.toast("Lineup shuffled + reset");
    }
    toast(text) {
      let t = document.querySelector(".toast");
      if (!t) {
        t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t);
        const s = document.createElement("style");
        s.textContent = `.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.55);color:rgba(234,240,255,.92);font:12px ui-sans-serif,system-ui;backdrop-filter:blur(10px);box-shadow:0 18px 60px rgba(0,0,0,.45);opacity:0;pointer-events:none;z-index:9999;}`;
        document.head.appendChild(s);
      }
      t.textContent = text;
      t.animate([
        {opacity:0,transform:"translateX(-50%) translateY(8px)"},
        {opacity:1,transform:"translateX(-50%) translateY(0px)"},
        {opacity:1,transform:"translateX(-50%) translateY(0px)"},
        {opacity:0,transform:"translateX(-50%) translateY(8px)"}
      ], {duration:1800,easing:"cubic-bezier(.2,.8,.2,1)"});
    }
    hexToRgba(hex, a = 1) {
      const h = hex.replace("#","").trim();
      const full = h.length === 3 ? h.split("").map(c => c+c).join("") : h;
      const n = parseInt(full, 16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
    }
  }
  new NeonAccordion(accEl);
})();
</script>
